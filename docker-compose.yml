services:
    refarwan-web-svelte-redis:
        image: redis:8.0
        container_name: refarwan-web-svelte-redis
        restart: always
        ports:
            - 127.0.0.1:${REDIS_PORT}:6379
        command: >
            redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - refarwan-web-svelte-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    refarwan-web-svelte:
        container_name: refarwan-web-svelte
        image: ghcr.io/refarwan/refarwan-web-svelte:${IMAGE_VERSION:-staging}
        env_file:
            - path: .env
              required: true
        environment:
            REDIS_URL: redis://:${REDIS_PASSWORD}@refarwan-web-svelte-redis:6379
        ports:
            - 127.0.0.1:${PORT}:${PORT}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: always

volumes:
    refarwan-web-svelte-redis-data:
