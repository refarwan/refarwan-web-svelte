services:
  refarwan-web-redis:
    image: redis:8.0
    container_name: refarwan-web-redis
    restart: always
    ports:
      - 127.0.0.1:${REDIS_PORT}:6379
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - refarwan-web-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  refarwan-web-svelte:
    container_name: refarwan-web-svelte
    image: ghcr.io/refarwan/refarwan-web-svelte:${IMAGE_VERSION:-staging}

    # Runtime env dibaca dari file .env di masing-masing server (staging / production)
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      PORT: ${PORT:-3110}
      NODE_ENV: ${NODE_ENV:-production}
      # adapter-node defaults to 512K, far below nginx's client_max_body_size —
      # raise it so profile photo / favicon uploads aren't rejected with 413.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-1G}
    ports:
      - 127.0.0.1:${PORT:-3110}:${PORT:-3110}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always

volumes:
  refarwan-web-redis-data:
