services:
    refarwan-web-redis:
        image: redis:8.0
        container_name: refarwan-web-redis
        restart: always
        ports:
            - 127.0.0.1:${REDIS_PORT}:6379
        command: >
            redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - refarwan-web-redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    refarwan-web-svelte:
        container_name: refarwan-web-svelte
        image: ghcr.io/refarwan/refarwan-web-svelte:${IMAGE_VERSION:-staging}
        environment:
            PORT: ${PORT:-5173}
            NODE_ENV: production
            BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-1G}
            PUBLIC_API_URL: ${PUBLIC_API_URL}
            REDIS_URL: redis://:${REDIS_PASSWORD}@refarwan-web-redis:6379
        ports:
            - 127.0.0.1:${PORT:-5173}:${PORT:-5173}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: always

volumes:
    refarwan-web-redis-data:
