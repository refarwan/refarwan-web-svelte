name: CD Production

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository }}:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code (untuk ambil docker-compose)
              uses: actions/checkout@v4

            # Salin docker-compose.yml dari runner ke VPS
            - name: Copy docker-compose to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.HOST_PRODUCTION }}
                  username: ${{ secrets.USERNAME_PRODUCTION }}
                  key: ${{ secrets.PRIVATE_KEY_PRODUCTION }}
                  port: ${{ secrets.PORT_PRODUCTION || 22 }}
                  source: "docker-compose.yml"
                  target: ${{ secrets.PATH_PRODUCTION }}

            # Jalankan pull image dan up container
            - name: Deploy using SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.HOST_PRODUCTION }}
                  username: ${{ secrets.USERNAME_PRODUCTION }}
                  key: ${{ secrets.PRIVATE_KEY_PRODUCTION }}
                  port: ${{ secrets.PORT_PRODUCTION || 22 }}
                  script: |
                      set -e
                      cd ${{ secrets.PATH_PRODUCTION }}

                      # 1. Login ke GHCR di VPS
                      echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # 2. Pull image
                      IMAGE_VERSION=latest docker compose pull refarwan-web-svelte

                      # 3. Jalankan container
                      IMAGE_VERSION=latest docker compose up -d

                      # 4. Bersihkan image usang (dangling image)
                      docker image prune -f
                      echo "Deployment Production selesai!"

            - name: Hapus image lama di GHCR
              uses: vlaurin/action-ghcr-prune@v0.6.0
              with:
                  token: ${{ secrets.CR_PAT }}
                  user: ${{ github.repository_owner }}
                  container: refarwan-web-svelte
                  dry-run: false
                  keep-last: 0
                  prune-untagged: true
